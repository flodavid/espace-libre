id: io.github.flodavid.EspaceLibre
runtime: io.elementary.Platform
runtime-version: '9.1'
sdk: io.elementary.Sdk
command: espacelibre
finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--device=all'
  - '--filesystem=/media'
  - '--filesystem=/run/media'
  - '--filesystem=/mnt'
  - '--filesystem=host-etc:ro'
  - '--filesystem=xdg-run/gvfsd'
  - '--filesystem=xdg-run/gvfs'
  - '--talk-name=org.gtk.vfs.*'
  # To be able to run flatpak-spawn --host of pkexec
  - '--talk-name=org.freedesktop.Flatpak'

modules:
  - name: EspaceLibre
    buildsystem: meson
    sources:
      - type: dir
        path: .
