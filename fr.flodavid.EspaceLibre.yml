id: fr.flodavid.EspaceLibre
runtime: io.elementary.Platform
runtime-version: '8.2'
sdk: io.elementary.Sdk
command: espacelibre
finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--device=all'
  - '--filesystem=host-etc:ro'
  - '--filesystem=host:ro'
  - '--filesystem=host:ro'
  - '--filesystem=xdg-run/gvfsd'
  - '--filesystem=xdg-run/gvfs'
  - '--talk-name=org.gtk.vfs.*'

modules:
  - name: EspaceLibre
    buildsystem: meson
    sources:
      - type: dir
        path: .
